<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solar Forecast</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1d2632;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #9da7b3;
      --accent: #f0b429;
      --accent-hover: #ffc94d;
      --danger: #ff7b72;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button, input, select {
      font: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1100;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 10px 16px;
      background: rgba(13, 17, 23, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .menu-button,
    .primary-button,
    .secondary-button {
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--panel-2);
      cursor: pointer;
    }

    .menu-button { padding: 7px 11px; }
    .primary-button, .secondary-button { padding: 9px 13px; }
    .primary-button {
      color: #1a1a1a;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }
    .primary-button:hover { background: var(--accent-hover); }

    .title {
      margin: 0;
      font-size: 1.05rem;
    }

    .sidebar {
      position: fixed;
      top: 58px;
      left: 0;
      bottom: 0;
      z-index: 1050;
      width: 290px;
      padding: 16px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      transform: translateX(0);
      transition: transform 180ms ease;
    }
    .sidebar.collapsed { transform: translateX(-100%); }

    .field {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.82rem;
    }

    input, select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #0d1117;
    }

    .inline-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .inline-row .field { flex: 1; min-width: 110px; }

    .time-window-inline {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px;
    }
    .time-window-inline .field {
      min-width: 100px;
      flex: 1;
    }

    .per-hour-grid {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .per-hour-row {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 8px;
      align-items: center;
    }

    .content-wrap {
      position: fixed;
      inset: 58px 0 0 0;
      transition: margin-left 180ms ease;
    }
    body.sidebar-open .content-wrap {
      margin-left: 290px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 420px;
      background: #202832;
    }

    .leaflet-control-zoom {
      z-index: 500;
      margin-right: 10px !important;
      margin-bottom: 10px !important;
    }
    body.sidebar-open .leaflet-control-zoom {
      display: none !important;
    }

    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .sidebar {
        width: min(82vw, 290px);
      }
      body.sidebar-open .content-wrap {
        margin-left: 0;
      }
    }
  </style>
</head>
<body class="sidebar-open">
  <header class="topbar">
    <button id="menuToggle" class="menu-button" type="button" aria-label="Collapse favorites menu" aria-expanded="true">☰</button>
    <h1 class="title">Solar Forecast</h1>
  </header>

  <aside id="sidebar" class="sidebar" aria-label="Favorite settings">
    <div class="field">
      <label><input id="batteryModeEnabled" type="checkbox" /> Enable battery mode</label>
    </div>

    <div class="field">
      <label for="loadMode">Load mode</label>
      <select id="loadMode">
        <option value="constant-day">constant through day</option>
        <option value="time-window">constant through time window</option>
        <option value="per-hour">custom per hour</option>
      </select>
    </div>

    <div class="field">
      <label for="loadValue">Load value</label>
      <div class="inline-row">
        <input id="loadValue" type="number" min="0" step="1" value="1500" />
        <select id="loadUnit" aria-label="Load unit">
          <option value="w" selected>W</option>
          <option value="kw">kW</option>
        </select>
      </div>
    </div>

    <div id="timeWindowWrap" class="time-window-inline hidden">
      <div class="field">
        <label for="loadStartHour">Start</label>
        <div class="inline-row">
          <select id="loadStartHour"></select>
          <span>:</span>
          <select id="loadStartMinute"></select>
        </div>
      </div>
      <div class="field">
        <label for="loadEndHour">End</label>
        <div class="inline-row">
          <select id="loadEndHour"></select>
          <span>:</span>
          <select id="loadEndMinute"></select>
        </div>
      </div>
    </div>

    <div id="perHourWrap" class="per-hour-grid hidden"></div>
  </aside>

  <div class="content-wrap">
    <div id="map" aria-label="Map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const elements = {
      sidebar: document.getElementById("sidebar"),
      menuToggle: document.getElementById("menuToggle"),
      batteryModeEnabled: document.getElementById("batteryModeEnabled"),
      loadMode: document.getElementById("loadMode"),
      loadValue: document.getElementById("loadValue"),
      loadUnit: document.getElementById("loadUnit"),
      timeWindowWrap: document.getElementById("timeWindowWrap"),
      perHourWrap: document.getElementById("perHourWrap"),
      loadStartHour: document.getElementById("loadStartHour"),
      loadStartMinute: document.getElementById("loadStartMinute"),
      loadEndHour: document.getElementById("loadEndHour"),
      loadEndMinute: document.getElementById("loadEndMinute")
    };

    function setSidebarOpen(open) {
      const isOpen = Boolean(open);
      elements.sidebar.classList.toggle("collapsed", !isOpen);
      document.body.classList.toggle("sidebar-open", isOpen);
      elements.menuToggle.setAttribute("aria-expanded", String(isOpen));
      elements.menuToggle.setAttribute("aria-label", isOpen ? "Collapse favorites menu" : "Open favorites menu");
      if (map) {
        setTimeout(() => map.invalidateSize(), 220);
      }
    }

    function populateTimeSelects() {
      const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
      const minutes = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, "0"));

      elements.loadStartHour.innerHTML = hours.map((h) => `<option value="${h}">${h}</option>`).join("");
      elements.loadEndHour.innerHTML = hours.map((h) => `<option value="${h}">${h}</option>`).join("");
      elements.loadStartMinute.innerHTML = minutes.map((m) => `<option value="${m}">${m}</option>`).join("");
      elements.loadEndMinute.innerHTML = minutes.map((m) => `<option value="${m}">${m}</option>`).join("");

      elements.loadStartHour.value = "08";
      elements.loadStartMinute.value = "00";
      elements.loadEndHour.value = "18";
      elements.loadEndMinute.value = "00";
    }

    function buildPerHourInputs() {
      elements.perHourWrap.innerHTML = Array.from({ length: 24 }, (_, index) => {
        const label = `${String(index).padStart(2, "0")}:00`;
        return `
          <div class="per-hour-row">
            <label>${label}</label>
            <input type="number" min="0" step="0.1" value="0" data-hour="${index}" aria-label="Load for ${label}" />
          </div>
        `;
      }).join("");
    }

    function updateLoadFieldVisibility() {
      const enabled = elements.batteryModeEnabled.checked;
      if (!enabled) {
        elements.timeWindowWrap.classList.add("hidden");
        elements.perHourWrap.classList.add("hidden");
        return;
      }

      const mode = elements.loadMode.value;
      elements.timeWindowWrap.classList.toggle("hidden", mode !== "time-window");
      elements.perHourWrap.classList.toggle("hidden", mode !== "per-hour");
    }

    document.addEventListener("click", (event) => {
      const clickedSidebar = elements.sidebar.contains(event.target);
      const clickedToggle = elements.menuToggle.contains(event.target);
      const clickedInsideMap = event.target.closest("#map") || event.target.closest(".leaflet-control");
      const sidebarOpen = document.body.classList.contains("sidebar-open");

      if (!clickedSidebar && !clickedToggle && !clickedInsideMap && sidebarOpen) {
        setSidebarOpen(false);
      }
    });

    elements.menuToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      setSidebarOpen(!document.body.classList.contains("sidebar-open"));
    });

    elements.batteryModeEnabled.addEventListener("change", updateLoadFieldVisibility);
    elements.loadMode.addEventListener("change", updateLoadFieldVisibility);

    const map = L.map("map").setView([40.7128, -74.006], 5);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);
    map.zoomControl.setPosition("bottomright");

    populateTimeSelects();
    buildPerHourInputs();
    updateLoadFieldVisibility();
    setSidebarOpen(true);
  </script>
</body>
</html>
